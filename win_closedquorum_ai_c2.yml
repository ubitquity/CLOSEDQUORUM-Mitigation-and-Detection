title: CLOSEDQUORUM Behavioral Quorum & Execution Pattern
id: 8a4b3d21-9f8c-4a3e-b8d2-11c5f3e7a9bb
status: experimental
description: Detects a single process making outbound connections to multiple LLM APIs followed by LSASS access or process injection, indicative of CLOSEDQUORUM's autonomous voting and execution chain.
logsource:
  category: process_creation
  product: windows
detection:
  network_llm_apis:
    EventID: 3 # Sysmon Network Connection
    DestinationHostname|contains:
      - 'api.deepseek.com'
      - 'api.mistral.ai'
      - 'generativelanguage.googleapis.com'
      - 'openrouter.ai'
  
  network_exfil:
    EventID: 3
    DestinationHostname|contains: 'discord.com/api/webhooks'

  malicious_action:
    EventID: 
      - 8  # CreateRemoteThread (Process Injection)
      - 10 # ProcessAccess (LSASS access)
    TargetImage|endswith: '\lsass.exe'

  condition: 
    # The process must contact at least two different LLM providers AND attempt an execution/steal action within a short timeframe
    (network_llm_apis | count(DestinationHostname) > 1) and (malicious_action or network_exfil) | timeframe(2m)
falsepositives:
  - Legitimate developer tools (e.g., heavily integrated AI IDE extensions) that legitimately query multiple models and perform deep system hooks (very rare).
level: high
tags:
  - attack.credential_access
  - attack.t1003.001
  - attack.defense_evasion
  - attack.t1055
